services:
  dbms-api:
    build: .
    container_name: dbms-api
    restart: always
    command: >
      sh -c "flask --app=dbms init-db && 
             flask --app=dbms populate-db && 
             gunicorn -w 4 -b 0.0.0.0:8000 'dbms:create_app()'"
    volumes:
      - .:/app

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "10013:443" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro 
    depends_on:
      - dbms-api