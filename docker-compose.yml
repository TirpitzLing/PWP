services:
  # Local RabbitMQ broker for background report jobs
  rabbitmq:
    image: rabbitmq:3-management
    container_name: dbms-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  # Backend API
  dbms-api:
    build: .
    container_name: dbms-api
    restart: always
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2F
    command: >
      sh -c "flask --app=dbms init-db && 
             flask --app=dbms populate-db && 
             gunicorn -w 4 -b 0.0.0.0:8000 'dbms:create_app()'"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/recipes/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - rabbitmq

  
  # Reverse Proxy & Security
  nginx:
    image: nginx:latest
    restart: always
    # Port mapping: External (Host) 10013 maps to Internal (Nginx) 443
    ports:
      - "10013:443" 
    # Read-Only (ro) mounts for configuration and certificates
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro 
    depends_on:
      - dbms-api