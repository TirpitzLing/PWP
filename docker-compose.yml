services:
  # Local RabbitMQ broker for background report jobs
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  dbms-api:
    build: .
    container_name: dbms-api
    restart: always
    command: >
      sh -c "flask --app=dbms init-db &&
             flask --app=dbms populate-db &&
             gunicorn -w 4 -b 0.0.0.0:8000 'dbms:create_app()'"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/recipes/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy

  
  # Reverse Proxy & Security
  nginx:
    image: nginx:latest
    restart: always
    # Port mapping: External (Host) 10013 maps to Internal (Nginx) 443
    ports:
      - "10013:443" 
    # Read-Only (ro) mounts for configuration and certificates
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro 
    depends_on:
      dbms-api:
        condition: service_healthy
      aux-service:
        condition: service_started

  # Auxiliary report service — has its own Flask API + RabbitMQ worker.
  # Clients call this directly (via nginx /aux/) for report operations.
  # It calls the DBMS API for nutrition data; never touches the DBMS database.
  aux-service:
    build: ./report_worker
    container_name: aux-service
    restart: always
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - DBMS_API_BASE_URL=http://dbms-api:8000/api
      - DBMS_API_KEY=admin-secret-key
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      dbms-api:
        condition: service_healthy