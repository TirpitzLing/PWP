[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dbms"
version = "1.0.0"
dependencies = [
    "Flask==3.1.2",
    "Flask-Caching==2.3.1",
    "Flask-RESTful==0.3.10",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.46",
    "jsonschema",
    "werkzeug==3.1.5",
    "flask-swagger-ui==4.11.1",
]

[tool.black]
line-length = 79

[tool.setuptools]
packages = ["dbms"]