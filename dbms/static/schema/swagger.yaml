openapi: 3.0.4
info:
    title: Daily Bowl Management System API
    version: 1.0.0
    description: |
        This is an API for managing users, recipes, ingredients, and nutrition.
        It is used in the Programmable Web Project course.
    # termsOfService: http://totally.not.placehold.er/
    contact:
        # url: http://totally.not.placehold.er/
        email: azhou25@student.oulu.fi, tliu25@student.oulu.fi, jling25@student.oulu.fi
    license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
    - url: /api
      description: Local Server

components:
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            in: header
            name: dbms-api-key
            description: Provide your API key to access protected endpoints.

    schemas:
        # for error response
        ErrorResponse:
            type: object
            properties:
                error:
                    type: string
                    description: error type
                message:
                    type: string
                    description: error description
            example:
                error: "Forbidden"
                message: "You can only update your own profile."

        User:
            type: object
            properties:
                id:
                    type: integer
                username:
                    type: string
                email:
                    type: string
                created_at:
                    type: string
                    format: date-time
                allergies:
                    type: string
                    nullable: true
            example:
                id: 1
                username: "oulu_chef"
                email: "chef@student.oulu.fi"
                created_at: "2026-03-31T14:00:00Z"
                allergies: "Lactose"

        UserCreate:
            type: object
            required: [username, email, pwd]
            properties:
                username:
                    type: string
                email:
                    type: string
                pwd:
                    type: string
            example:
                username: "oulu_chef"
                email: "chef@student.oulu.fi"
                pwd: "SecurePassword123!"

        UserCreateResponse:
            type: object
            properties:
                id:
                    type: integer
                username:
                    type: string
                email:
                    type: string
                created_at:
                    type: string
                    format: date-time
                allergies:
                    type: string
                    nullable: true
                api_key:
                    type: string
            example:
                id: 1
                username: "oulu_chef"
                email: "chef@student.oulu.fi"
                created_at: "2026-03-31T14:00:00Z"
                allergies: null
                api_key: "dbms-test-key-7a8b9c"

        UserUpdate:
            type: object
            properties:
                username:
                    type: string
                email:
                    type: string
                pwd:
                    type: string
                allergies:
                    type: string
            example:
                username: "oulu_master_chef"
                email: "master_chef@student.oulu.fi"
                pwd: "NewSecurePassword456!"
                allergies: "Peanuts, Lactose"

        Recipe:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                procedure:
                    type: string
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                servings:
                    type: integer
                    nullable: true
                cuisine_type:
                    type: string
                    nullable: true
                cooking_methods:
                    type: string
                    nullable: true
                created_by:
                    type: integer
            example:
                id: 88
                title: "Tomato and Egg Stir-fry"
                procedure: "1. Beat the eggs. 2. Chop tomatoes into chunks. 3. Scramble eggs in hot oil and set aside. 4. Stir-fry tomatoes until soft and juicy, return eggs to the pan, season with salt and a pinch of sugar, and serve."
                created_at: "2026-03-31T18:00:00Z"
                servings: 2
                cuisine_type: "Chinese"
                cooking_methods: "Stir-frying"
                created_by: 1

        RecipeCreate:
            type: object
            required: [title]
            properties:
                title:
                    type: string
                procedure:
                    type: string
                servings:
                    type: integer
                cuisine_type:
                    type: string
            example:
                title: "Tomato and Egg Stir-fry"
                procedure: "1. Beat the eggs. 2. Chop tomatoes into chunks. 3. Scramble eggs in hot oil and set aside. 4. Stir-fry tomatoes until soft and juicy, return eggs to the pan, season with salt and a pinch of sugar, and serve."
                servings: 2
                cuisine_type: "Chinese"

        RecipeUpdate:
            type: object
            properties:
                title:
                    type: string
                procedure:
                    type: string
                servings:
                    type: integer
            example:
                title: "Homestyle Tomato and Egg Stir-fry"
                procedure: "1. Add a splash of water to eggs before beating. 2. Peel and chop tomatoes. 3. Scramble eggs. 4. Sauté scallions, cook tomatoes until soft, mix in eggs, and season."
                servings: 3

        RecipeNutritionStats:
            type: object
            properties:
                total_calories:
                    type: number
                total_carbs:
                    type: number
                total_protein:
                    type: number
                total_fat:
                    type: number
            example:
                total_calories: 320.5
                total_carbs: 15.0
                total_protein: 18.5
                total_fat: 22.0

        Ingredient:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                img_url:
                    type: string
                    nullable: true
                allergy:
                    type: string
                    nullable: true
                calories:
                    type: number
                carbs:
                    type: number
                protein:
                    type: number
                fat:
                    type: number
            example:
                id: 20
                name: "Tomato"
                img_url: "https://www.walmart.com/ip/Fresh-Slicing-Tomato-Each/44390971"
                allergy: null
                calories: 18.0
                carbs: 3.9
                protein: 0.9
                fat: 0.2

        IngredientCreate:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                calories:
                    type: number
                protein:
                    type: number
                carbs:
                    type: number
                fat:
                    type: number
            example:
                name: "Egg"
                calories: 143.0
                protein: 12.6
                carbs: 0.7
                fat: 9.5

        IngredientUpdate:
            type: object
            properties:
                name:
                    type: string
                calories:
                    type: number
            example:
                name: "Free-range Egg"
                calories: 150.0

        RecipeIngredient:
            type: object
            properties:
                recipe_id:
                    type: integer
                ingredient_id:
                    type: integer
                amount:
                    type: number
                unit:
                    type: string
            example:
                recipe_id: 88
                ingredient_id: 20
                amount: 300.0
                unit: "grams"

        RecipeIngredientCreate:
            type: object
            required: [ingredient_id]
            properties:
                ingredient_id:
                    type: integer
                amount:
                    type: number
                unit:
                    type: string
            example:
                ingredient_id: 20
                amount: 3.0
                unit: "pieces"

        RecipeIngredientUpdate:
            type: object
            properties:
                amount:
                    type: number
                unit:
                    type: string
            example:
                amount: 400.0
                unit: "grams"

        Save:
            type: object
            properties:
                user_id:
                    type: integer
                recipe_id:
                    type: integer
                created_at:
                    type: string
                    format: date-time
            example:
                user_id: 1
                recipe_id: 88
                created_at: "2026-03-31T18:30:00Z"

        SaveCreate:
            type: object
            required: [recipe_id]
            properties:
                recipe_id:
                    type: integer
            example:
                recipe_id: 88

    parameters:
        LimitParam:
            name: limit
            in: query
            schema:
                type: integer
                default: 10
        OffsetParam:
            name: offset
            in: query
            schema:
                type: integer
                default: 0
        UserPathParam:
            name: user
            in: path
            required: true
            schema:
                type: integer
        RecipePathParam:
            name: recipe
            in: path
            required: true
            schema:
                type: integer
        IngredientPathParam:
            name: ingredient
            in: path
            required: true
            schema:
                type: integer

paths:
    # ---------------- USERS ----------------
    /users/:
        get:
            tags: [Users]
            summary: Get a paginated list of users
            parameters:
                - $ref: "#/components/parameters/LimitParam"
                - $ref: "#/components/parameters/OffsetParam"
            responses:
                "200":
                    description: A list of users
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/User"
                "400":
                    description: Bad Request (Invalid pagination parameters)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Bad Request"
                                message: "Invalid pagination parameters. Limit and offset must be non-negative."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)
        post:
            tags: [Users]
            summary: Register a new user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UserCreate"
            responses:
                "201":
                    description: User created successfully
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserCreateResponse"
                "400":
                    description: Bad request (validation error)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Bad Request"
                                message: "JSON Schema validation failed."
                "409":
                    description: Username or email already exists
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Conflict"
                                message: "Username or email already exists"
                "415":
                    description: Unsupported Media Type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unsupported Media Type"
                                message: "Request payload must be JSON."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)

    /users/{user}/:
        get:
            tags: [Users]
            summary: Get user profile
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            responses:
                "200":
                    description: A user profile
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "User with id {value} not found."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)
        put:
            tags: [Users]
            summary: Update user profile
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UserUpdate"
            responses:
                "204":
                    description: User updated successfully
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Bad Request"
                                message: "JSON Schema validation failed."
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unauthorized"
                                message: "Authentication required. Please provide a valid dbms-api-key header."
                "403":
                    description: Forbidden (Not your account)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Forbidden"
                                message: "You can only update your own profile."
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "User with id {value} not found."
                "409":
                    description: Conflict
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Conflict"
                                message: "Username or email already exists"
                "415":
                    description: Unsupported Media Type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unsupported Media Type"
                                message: "Request payload must be JSON."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)
        delete:
            tags: [Users]
            summary: Delete user account
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            responses:
                "204":
                    description: User deleted successfully
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unauthorized"
                                message: "Invalid API key."
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Forbidden"
                                message: "You can only delete your own account."
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "User with id {value} not found."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)

    /users/{user}/recipes/:
        get:
            tags: [Users]
            summary: Get recipes created by a specific user
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            responses:
                "200":
                    description: A list of recipes
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Recipe"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "User with id {value} not found."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)

    # ---------------- SAVES ----------------
    /users/{user}/saves/:
        get:
            tags: [Saves]
            summary: Get all saved recipes for a user
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            responses:
                "200":
                    description: List of saved recipes
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Save"
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unauthorized"
                                message: "Invalid API key."
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Forbidden"
                                message: "You can only view your own saved recipes."
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "User with id {value} not found."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)
        post:
            tags: [Saves]
            summary: Save a recipe to collection
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SaveCreate"
            responses:
                "201":
                    description: Recipe saved
                    headers:
                        Location:
                            schema:
                                type: string
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Bad Request"
                                message: "Missing recipe_id in the request payload."
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unauthorized"
                                message: "Invalid API key."
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Forbidden"
                                message: "You can only save recipes to your own account."
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "User with id {value} not found."
                "409":
                    description: Recipe already saved
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Conflict"
                                message: "Recipe already saved by this user"
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)

    /users/{user}/saves/{recipe}/:
        delete:
            tags: [Saves]
            summary: Remove a saved recipe from collection
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
                - $ref: "#/components/parameters/RecipePathParam"
            responses:
                "204":
                    description: Save removed successfully
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unauthorized"
                                message: "Invalid API key."
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Forbidden"
                                message: "You can only remove recipes from your own account"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "Save with id {value} not found."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)

    # ---------------- RECIPES ----------------
    /recipes/:
        get:
            tags: [Recipes]
            summary: Get paginated recipes
            parameters:
                - $ref: "#/components/parameters/LimitParam"
                - $ref: "#/components/parameters/OffsetParam"
            responses:
                "200":
                    description: List of recipes
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Recipe"
                "400":
                    description: Bad Request (Invalid pagination parameters)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Bad Request"
                                message: "Invalid pagination parameters. Limit and offset must be non-negative."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)
        post:
            tags: [Recipes]
            summary: Create a new recipe
            security:
                - ApiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RecipeCreate"
            responses:
                "201":
                    description: Recipe created
                    headers:
                        Location:
                            schema:
                                type: string
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Bad Request"
                                message: "JSON Schema validation failed."
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unauthorized"
                                message: "Invalid API key."
                "415":
                    description: Unsupported Media Type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unsupported Media Type"
                                message: "Request payload must be JSON"
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)

    /recipes/{recipe}/:
        get:
            tags: [Recipes]
            summary: Get recipe details
            parameters:
                - $ref: "#/components/parameters/RecipePathParam"
            responses:
                "200":
                    description: Recipe details
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Recipe"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "Recipe with id {value} not found."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)
        put:
            tags: [Recipes]
            summary: Update a recipe
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/RecipePathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RecipeUpdate"
            responses:
                "204":
                    description: Updated successfully
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Bad Request"
                                message: "JSON Schema validation failed."
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unauthorized"
                                message: "Invalid API key."
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Forbidden"
                                message: "You can only update your own recipes."
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "Recipe with id {value} not found."
                "415":
                    description: Unsupported Media Type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unsupported Media Type"
                                message: "Request payload must be JSON."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)
        delete:
            tags: [Recipes]
            summary: Delete a recipe
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/RecipePathParam"
            responses:
                "204":
                    description: Deleted successfully
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Unauthorized"
                                message: "Invalid API key."
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Forbidden"
                                message: "You can only delete your own recipes."
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "Recipe with id {value} not found."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)

    /recipes/{recipe}/nutrition/:
        get:
            tags: [Recipes]
            summary: Calculate total nutrition for a recipe
            parameters:
                - $ref: "#/components/parameters/RecipePathParam"
            responses:
                "200":
                    description: Nutritional information
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RecipeNutritionStats"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                error: "Not Found"
                                message: "Recipe with id {value} not found."
                "500":
                    description: Internal Server Error (Database failure or unexpected server error)

    # ---------------- INGREDIENTS ----------------
    /ingredients/:
        get:
            tags: [Ingredients]
            summary: Get paginated ingredients
            parameters:
                - $ref: "#/components/parameters/LimitParam"
                - $ref: "#/components/parameters/OffsetParam"
            responses:
                "200":
                    description: List of ingredients
                    content:
