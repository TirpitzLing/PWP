openapi: 3.0.4
info:
    title: Daily Bowl Management System API
    version: 1.0.0
    description: |
        This is an API for managing users, recipes, ingredients, and nutrition.
        It is used in the Programmable Web Project course.
    # termsOfService: http://totally.not.placehold.er/
    contact:
        # url: http://totally.not.placehold.er/
        # email: azhou25@student.oulu.fi, tliu25@student.oulu.fi, jling25@student.oulu.fi
        name: "Team: azhou25@, tliu25@, jling25@ (student.oulu.fi)"
    license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
    - url: /api
      description: Local Server

components:
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            in: header
            name: dbms-api-key
            description: Provide your API key to access protected endpoints.

    schemas:
        # for error response
        ErrorResponse:
            type: object
            properties:
                code:
                    type: integer
                    description: HTTP status code
                description:
                    type: string
                    description: Detailed error description
                name:
                    type: string
                    description: Name of the error
            example:
                code: 403
                description: "You can only update your own profile."
                name: "Forbidden"

        User:
            type: object
            properties:
                id:
                    type: integer
                username:
                    type: string
                email:
                    type: string
                created_at:
                    type: string
                    format: date-time
                allergies:
                    type: string
                    nullable: true
            example:
                id: 1
                username: "oulu_chef"
                email: "chef@student.oulu.fi"
                created_at: "2026-03-31T14:00:00Z"
                allergies: "Lactose"

        UserCreate:
            type: object
            required: [username, email, pwd]
            properties:
                username:
                    type: string
                email:
                    type: string
                pwd:
                    type: string
            example:
                username: "oulu_chef"
                email: "chef@student.oulu.fi"
                pwd: "SecurePassword123!"

        UserCreateResponse:
            type: object
            properties:
                id:
                    type: integer
                username:
                    type: string
                email:
                    type: string
                created_at:
                    type: string
                    format: date-time
                allergies:
                    type: string
                    nullable: true
                api_key:
                    type: string
            example:
                id: 1
                username: "oulu_chef"
                email: "chef@student.oulu.fi"
                created_at: "2026-03-31T14:00:00Z"
                allergies: null
                api_key: "dbms-test-key-7a8b9c"

        UserUpdate:
            type: object
            properties:
                username:
                    type: string
                email:
                    type: string
                pwd:
                    type: string
                allergies:
                    type: string
            example:
                username: "oulu_master_chef"
                email: "master_chef@student.oulu.fi"
                pwd: "NewSecurePassword456!"
                allergies: "Peanuts, Lactose"

        Recipe:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                procedure:
                    type: string
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                servings:
                    type: integer
                    nullable: true
                cuisine_type:
                    type: string
                    nullable: true
                cooking_methods:
                    type: string
                    nullable: true
                img_url:
                    type: string
                    nullable: true
                created_by:
                    type: integer
                creator_username:
                    type: string
            example:
                id: 88
                title: "Tomato and Egg Stir-fry"
                procedure: "1. Beat the eggs. 2. Chop tomatoes into chunks. 3. Scramble eggs in hot oil and set aside. 4. Stir-fry tomatoes until soft and juicy, return eggs to the pan, season with salt and a pinch of sugar, and serve."
                created_at: "2026-03-31T18:00:00Z"
                servings: 2
                cuisine_type: "Chinese"
                cooking_methods: "Stir-frying"
                img_url: "https://example.com/recipe.jpg"
                created_by: 1
                creator_username: "oulu_chef"

        RecipeCreate:
            type: object
            required: [title]
            properties:
                title:
                    type: string
                procedure:
                    type: string
                servings:
                    type: integer
                cuisine_type:
                    type: string
                img_url:
                    type: string
            example:
                title: "Tomato and Egg Stir-fry"
                procedure: "1. Beat the eggs. 2. Chop tomatoes into chunks. 3. Scramble eggs in hot oil and set aside. 4. Stir-fry tomatoes until soft and juicy, return eggs to the pan, season with salt and a pinch of sugar, and serve."
                servings: 2
                cuisine_type: "Chinese"
                img_url: "https://example.com/recipe.jpg"

        RecipeUpdate:
            type: object
            properties:
                title:
                    type: string
                procedure:
                    type: string
                servings:
                    type: integer
                img_url:
                    type: string
            example:
                title: "Homestyle Tomato and Egg Stir-fry"
                procedure: "1. Add a splash of water to eggs before beating. 2. Peel and chop tomatoes. 3. Scramble eggs. 4. Sauté scallions, cook tomatoes until soft, mix in eggs, and season."
                servings: 3
                img_url: "https://example.com/recipe_updated.jpg"

        RecipeNutritionStats:
            type: object
            properties:
                total_calories:
                    type: number
                total_carbs:
                    type: number
                total_protein:
                    type: number
                total_fat:
                    type: number
            example:
                total_calories: 320.5
                total_carbs: 15.0
                total_protein: 18.5
                total_fat: 22.0

        Ingredient:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                img_url:
                    type: string
                    nullable: true
                allergy:
                    type: string
                    nullable: true
                calories:
                    type: number
                carbs:
                    type: number
                protein:
                    type: number
                fat:
                    type: number
            example:
                id: 20
                name: "Tomato"
                img_url: "https://www.walmart.com/ip/Fresh-Slicing-Tomato-Each/44390971"
                allergy: null
                calories: 18.0
                carbs: 3.9
                protein: 0.9
                fat: 0.2

        IngredientCreate:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                calories:
                    type: number
                protein:
                    type: number
                carbs:
                    type: number
                fat:
                    type: number
            example:
                name: "Egg"
                calories: 143.0
                protein: 12.6
                carbs: 0.7
                fat: 9.5

        IngredientUpdate:
            type: object
            properties:
                name:
                    type: string
                calories:
                    type: number
            example:
                name: "Free-range Egg"
                calories: 150.0

        RecipeIngredient:
            type: object
            properties:
                recipe_id:
                    type: integer
                ingredient_id:
                    type: integer
                amount:
                    type: number
                unit:
                    type: string
                ingredient:
                    $ref: "#/components/schemas/Ingredient"
            example:
                recipe_id: 88
                ingredient_id: 20
                amount: 300.0
                unit: "grams"
                ingredient:
                    id: 20
                    name: "Tomato"
                    img_url: "https://www.walmart.com/ip/Fresh-Slicing-Tomato-Each/44390971"
                    allergy: null
                    calories: 18.0
                    carbs: 3.9
                    protein: 0.9
                    fat: 0.2

        RecipeIngredientCreate:
            type: object
            required: [ingredient_id]
            properties:
                ingredient_id:
                    type: integer
                amount:
                    type: number
                unit:
                    type: string
            example:
                ingredient_id: 20
                amount: 3.0
                unit: "pieces"

        RecipeIngredientUpdate:
            type: object
            properties:
                amount:
                    type: number
                unit:
                    type: string
            example:
                amount: 400.0
                unit: "grams"

        Save:
            type: object
            properties:
                user_id:
                    type: integer
                recipe_id:
                    type: integer
                created_at:
                    type: string
                    format: date-time
            example:
                user_id: 1
                recipe_id: 88
                created_at: "2026-03-31T18:30:00Z"

        SaveCreate:
            type: object
            required: [recipe_id]
            properties:
                recipe_id:
                    type: integer
            example:
                recipe_id: 88
        RecipeCategoryAggregation:
            type: object
            properties:
                categories:
                    type: array
                    items:
                        type: object
                        properties:
                            cuisine_type:
                                type: string
                            recipe_count:
                                type: integer
            example:
                categories:
                    - cuisine_type: "Italian"
                      recipe_count: 5
                    - cuisine_type: "Chinese"
                      recipe_count: 3

    parameters:
        LimitParam:
            name: limit
            in: query
            schema:
                type: integer
                default: 10
        OffsetParam:
            name: offset
            in: query
            schema:
                type: integer
                default: 0
        UserPathParam:
            name: user
            in: path
            required: true
            schema:
                type: integer
        RecipePathParam:
            name: recipe
            in: path
            required: true
            schema:
                type: integer
        IngredientPathParam:
            name: ingredient
            in: path
            required: true
            schema:
                type: integer

paths:
    # ---------------- TOKENS (AUTH) ----------------
    /tokens/:
        post:
            tags: [Tokens]
            summary: Login to get a new API token
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, pwd]
                            properties:
                                email:
                                    type: string
                                pwd:
                                    type: string
                            example:
                                email: "chef@student.oulu.fi"
                                pwd: "SecurePassword123!"
            responses:
                "201":
                    description: Token created successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    token:
                                        type: string
                                example:
                                    token: "ab12cd34ef56..."
                "400":
                    description: Bad request (missing email or pwd)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 400
                                description: "Missing email or password."
                                name: "Bad Request"
                "401":
                    description: Unauthorized (invalid credentials)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 401
                                description: "Invalid email or password."
                                name: "Unauthorized"
                "415":
                    description: Unsupported Media Type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 415
                                description: "Request payload must be JSON."
                                name: "Unsupported Media Type"
        delete:
            tags: [Tokens]
            summary: Logout and destroy the current token
            security:
                - ApiKeyAuth: []
            responses:
                "204":
                    description: Logout successful, token invalidated
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 401
                                description: "Authentication required. Please provide a valid dbms-api-key header."
                                name: "Unauthorized"

    # ---------------- USERS ----------------
    /users/:
        get:
            tags: [Users]
            summary: Get a paginated list of users
            parameters:
                - $ref: "#/components/parameters/LimitParam"
                - $ref: "#/components/parameters/OffsetParam"
            responses:
                "200":
                    description: A list of users
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/User"
                "400":
                    description: Bad Request (Invalid pagination parameters)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 400
                                description: "Invalid pagination parameters. Limit and offset must be non-negative."
                                name: "Bad Request"
        post:
            tags: [Users]
            summary: Register a new user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UserCreate"
            responses:
                "201":
                    description: User created successfully
                    headers:
                        Location:
                            description: URI of the newly created user
                            schema:
                                type: string
                                example: /api/users/42
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserCreateResponse"
                "400":
                    description: Bad request (validation error)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 400
                                description: "JSON Schema validation failed."
                                name: "Bad Request"
                "409":
                    description: Username or email already exists
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 409
                                description: "Username or email already exists"
                                name: "Conflict"
                "415":
                    description: Unsupported Media Type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 415
                                description: "Request payload must be JSON."
                                name: "Unsupported Media Type"

    /users/{user}/:
        get:
            tags: [Users]
            summary: Get user profile
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            responses:
                "200":
                    description: A user profile
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 404
                                description: "User with id 42 not found."
                                name: "Not Found"
        put:
            tags: [Users]
            summary: Update user profile
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UserUpdate"
            responses:
                "204":
                    description: User updated successfully
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 400
                                description: "JSON Schema validation failed."
                                name: "Bad Request"
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 401
                                description: "Authentication required. Please provide a valid dbms-api-key header."
                                name: "Unauthorized"
                "403":
                    description: Forbidden (Not your account)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 403
                                description: "You can only update your own profile."
                                name: "Forbidden"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 404
                                description: "User with id 42 not found."
                                name: "Not Found"
                "409":
                    description: Conflict
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 409
                                description: "Username or email already exists"
                                name: "Conflict"
                "415":
                    description: Unsupported Media Type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 415
                                description: "Request payload must be JSON."
                                name: "Unsupported Media Type"
        delete:
            tags: [Users]
            summary: Delete user account
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            responses:
                "204":
                    description: User deleted successfully
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 401
                                description: "Invalid API key."
                                name: "Unauthorized"
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 403
                                description: "You can only delete your own account."
                                name: "Forbidden"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 404
                                description: "User with id 42 not found."
                                name: "Not Found"

    /users/{user}/recipes/:
        get:
            tags: [Users]
            summary: Get recipes created by a specific user
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            responses:
                "200":
                    description: A list of recipes
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Recipe"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 404
                                description: "User with id 42 not found."
                                name: "Not Found"

    # ---------------- SAVES ----------------
    /users/{user}/saves/:
        get:
            tags: [Saves]
            summary: Get all saved recipes for a user
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            responses:
                "200":
                    description: List of saved recipes
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Save"
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 401
                                description: "Invalid API key."
                                name: "Unauthorized"
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 403
                                description: "You can only view your own saved recipes."
                                name: "Forbidden"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 404
                                description: "User with id 42 not found."
                                name: "Not Found"
        post:
            tags: [Saves]
            summary: Save a recipe to collection
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SaveCreate"
            responses:
                "201":
                    description: Recipe saved
                    headers:
                        Location:
                            description: URI of the newly created save record
                            schema:
                                type: string
                                example: /api/users/42/saves/88
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 400
                                description: "Missing recipe_id in the request payload."
                                name: "Bad Request"
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 401
                                description: "Invalid API key."
                                name: "Unauthorized"
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 403
                                description: "You can only save recipes to your own account."
                                name: "Forbidden"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 404
                                description: "User with id 42 not found."
                                name: "Not Found"
                "409":
                    description: Recipe already saved
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 409
                                description: "Recipe already saved by this user"
                                name: "Conflict"

    /users/{user}/saves/{recipe}/:
        delete:
            tags: [Saves]
            summary: Remove a saved recipe from collection
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/UserPathParam"
                - $ref: "#/components/parameters/RecipePathParam"
            responses:
                "204":
                    description: Save removed successfully
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 401
                                description: "Invalid API key."
                                name: "Unauthorized"
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 403
                                description: "You can only remove recipes from your own account"
                                name: "Forbidden"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 404
                                description: "Save with id 42-88 not found."
                                name: "Not Found"

    # ---------------- RECIPES ----------------
    /recipes/:
        get:
            tags: [Recipes]
            summary: Get paginated recipes, filter by cuisine type, or get aggregated categories
            parameters:
                - $ref: "#/components/parameters/LimitParam"
                - $ref: "#/components/parameters/OffsetParam"
                - name: aggregate
                  in: query
                  description: "If set to 'categories', returns an aggregation of recipe counts by cuisine_type. (Ignores limit and offset)"
                  schema:
                      type: string
                      enum: [categories]
                - name: cuisine_type
                  in: query
                  description: "Filter the list of recipes by a specific cuisine type (e.g., Italian)."
                  schema:
                      type: string
            responses:
                "200":
                    description: A list of recipes or an aggregation of categories
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - type: array
                                      items:
                                          $ref: "#/components/schemas/Recipe"
                                    - $ref: "#/components/schemas/RecipeCategoryAggregation"
                "400":
                    description: Bad Request (Invalid pagination parameters)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 400
                                description: "Invalid pagination parameters. Limit and offset must be non-negative."
                                name: "Bad Request"
    /recipes/{recipe}/:
        get:
            tags: [Recipes]
            summary: Get recipe details
            parameters:
                - $ref: "#/components/parameters/RecipePathParam"
            responses:
                "200":
                    description: Recipe details
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Recipe"
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 404
                                description: "Recipe with id 88 not found."
                                name: "Not Found"
        put:
            tags: [Recipes]
            summary: Update a recipe
            security:
                - ApiKeyAuth: []
            parameters:
                - $ref: "#/components/parameters/RecipePathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RecipeUpdate"
            responses:
                "204":
                    description: Updated successfully
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 400
                                description: "JSON Schema validation failed."
                                name: "Bad Request"
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: 401
                                description: "Invalid API key."
                                name: "Unauthorized"
                "403":
                    description: Forbidden
                    content:
                        application/json:
