<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBMS Admin Management</title>
    <link rel="stylesheet" href="/static/admin/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login View -->
        <div id="login-view" class="view active">
            <div class="login-container">
                <h2>Admin Login</h2>
                <div id="login-error" class="error-msg"></div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="admin@test.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <header>
                <h1>DBMS Admin Dashboard</h1>
                <div class="user-info">
                    <span>Welcome, Admin</span>
                    <button id="logout-btn" class="btn btn-small">Logout</button>
                </div>
            </header>

            <nav class="tabs">
                <button class="tab-btn active" data-target="users">Users</button>
                <button class="tab-btn" data-target="ingredients">Ingredients</button>
                <button class="tab-btn" data-target="recipes">Recipes</button>
            </nav>

            <main class="content">
                <!-- Users Tab -->
                <div id="users-tab" class="tab-content active">
                    <div class="tab-header">
                        <h2>Manage Users</h2>
                        <button class="btn btn-primary" onclick="app.showModal('user-modal')">Add User</button>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody"></tbody>
                    </table>
                </div>

                <!-- Ingredients Tab -->
                <div id="ingredients-tab" class="tab-content">
                    <div class="tab-header">
                        <h2>Manage Ingredients</h2>
                        <button class="btn btn-primary" onclick="app.showModal('ingredient-modal')">Add Ingredient</button>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Calories</th>
                                <th>Carbs / Protein / Fat</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ingredients-tbody"></tbody>
                    </table>
                </div>

                <!-- Recipes Tab -->
                <div id="recipes-tab" class="tab-content">
                    <div class="tab-header">
                        <h2>Manage Recipes</h2>
                        <button class="btn btn-primary" onclick="app.showModal('recipe-modal')">Add Recipe</button>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Servings</th>
                                <th>Cuisine</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="recipes-tbody"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals for CRUD -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="app.hideModal('user-modal')">&times;</span>
            <h2 id="user-modal-title">Add User</h2>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="user-username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="user-email" required>
                </div>
                <div class="form-group" id="user-pwd-group">
                    <label>Password</label>
                    <input type="password" id="user-pwd">
                </div>
                <div class="form-group">
                    <label>Allergies</label>
                    <input type="text" id="user-allergies">
                </div>
                <button type="submit" class="btn btn-primary">Save User</button>
            </form>
        </div>
    </div>

    <div id="ingredient-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="app.hideModal('ingredient-modal')">&times;</span>
            <h2 id="ingredient-modal-title">Add Ingredient</h2>
            <form id="ingredient-form">
                <input type="hidden" id="ingredient-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="ingredient-name" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="ingredient-img_url">
                </div>
                <div class="form-group">
                    <label>Allergy</label>
                    <input type="text" id="ingredient-allergy">
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>Calories</label>
                        <input type="number" step="0.1" id="ingredient-calories">
                    </div>
                    <div class="form-group">
                        <label>Carbs</label>
                        <input type="number" step="0.1" id="ingredient-carbs">
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>Protein</label>
                        <input type="number" step="0.1" id="ingredient-protein">
                    </div>
                    <div class="form-group">
                        <label>Fat</label>
                        <input type="number" step="0.1" id="ingredient-fat">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Save Ingredient</button>
            </form>
        </div>
    </div>

    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="app.hideModal('recipe-modal')">&times;</span>
            <h2 id="recipe-modal-title">Add Recipe</h2>
            <form id="recipe-form">
                <input type="hidden" id="recipe-id">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="recipe-title" required>
                </div>
                <div class="form-group">
                    <label>Procedure</label>
                    <textarea id="recipe-procedure" rows="4"></textarea>
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>Servings</label>
                        <input type="number" id="recipe-servings">
                    </div>
                    <div class="form-group">
                        <label>Cuisine Type</label>
                        <input type="text" id="recipe-cuisine_type">
                    </div>
                </div>
                <div class="form-group">
                    <label>Cooking Methods</label>
                    <input type="text" id="recipe-cooking_methods">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="recipe-img_url">
                </div>
                <button type="submit" class="btn btn-primary">Save Recipe</button>
            </form>
        </div>
    </div>

    <script src="/static/admin/js/app.js?v=2"></script>
</body>
</html>
